name: ostora_accounting
description: "أسطورة المحاسبة - Legend of Accounting | Enterprise Mobile ERP by Ostora Systems"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.4
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.2
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  intl: any
  google_sign_in: ^6.3.0
  http: ^1.3.0
  in_app_purchase: ^3.2.1
  permission_handler: ^11.4.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon_512.png"
  adaptive_icon_background: "#0A3D2C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
